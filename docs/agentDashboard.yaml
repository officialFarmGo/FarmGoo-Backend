/api/v1/agentDashboard/agentBoard:
   get:
      summary: this endpoint is to get the agents dashboard Overview
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten the agents dashBoard overview

/api/v1/agentDashboard/agentsFarmersOverview:
   get:
      summary: this endpoint is to get the agents farmers Overview
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten the agents farmers overview

/api/v1/agentDashboard/getAlldeliveries:
   get:
      summary: this endpoint is to get all the agents deliveries
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten all the agents deliveries

/api/v1/agentDashboard/trackdelivery/{deliveryId}:
   get:
      summary: this endpoint is to get ONE agents deliveries
      parameters:
        - in: path
          name: deliveryId
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten ONE agents deliveries

/api/v1/agent/getFarmersUnderAgent:
   get:
      summary: this endpoint is to get all the farmers under the agent
      tags: [Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten all the farmes under the specified agent

/api/v1/agentDashboard/updateProfile:
  patch:
    summary: Update agent profile
    tags: [Agent]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              firstName:
                type: string
                description: Agent's first name
              lastName:
                type: string
                description: Agent's last name
              email:
                type: string
                format: email
                description: Agent's email address
              phoneNumber:
                type: string
                description: Agent's phone number
              password:
                type: string
                format: password
                description: New password (only include if changing password)
              profilePicture:
                type: string
                format: binary
                description: Profile picture image (JPG, PNG, GIF - max 2MB)
    responses:
      "200":
        description: Profile updated successfully
        