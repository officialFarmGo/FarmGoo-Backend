/api/v1/agentDashboard/agentBoard:
   get:
      summary: this endpoint is to get the agents dashboard Overview
      tags: [Agent DashBoard Overview]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten the agents dashBoard overview

/api/v1/agentDashboard/agentsFarmersOverview:
   get:
      summary: this endpoint is to get the agents farmers Overview
      tags: [The Agents onboarded farmers Overview]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten the agents farmers overview

/api/v1/agentDashboard/getAlldeliveries:
   get:
      summary: this endpoint is to get all the agents deliveries
      tags: [View all deliveries for the Agent]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten all the agents deliveries

/api/v1/agentDashboard/trackdelivery/{deliveryId}:
   get:
      summary: this endpoint is to get ONE agents deliveries
      parameters:
        - in: path
          name: deliveryId
      tags: [Track ONE Agents delivery]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten ONE agents deliveries

  