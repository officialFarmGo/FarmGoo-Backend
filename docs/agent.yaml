openapi: 3.0.0
info:
  title: documentation for Agents
  version: 1.0.0
  description: covers simple test for agent authenitcation
paths: 
  /api/v1/agent/signUp:
    post:
      summary: this endpoint is to create an agent
      tags: [Sign Up]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - firstName
                - lastName
                - phoneNumber
                - townOrVillage
                - password
              properties:
                firstName:
                  type: string
                  example: David 
                lastName:
                  type: string
                  example: Daniels
                email:
                  type: string
                  example: formatmail@gmail.com
                phoneNumber:
                  type: string
                  example: 08021342132
                townOrVillage:
                  type: string
                  example: ikorodu
                password:
                  type: string
                  example: StringerWe123@
      responses:
        "201":
          description: agent successfully created

  /api/v1/agent/verify:
    post:
      summary: this endpoint is to verify an agents email
      tags: [Verify Otp]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - email
                - otp
              properties:
                email:
                  type: string
                  example: formatmail@gmail.com
                otp:
                  type: string
                  example: 432123
      responses:
        "200":
          description: Agents email verified

  /api/v1/agent/agentLogin:
    post:
      summary: this endpoint is to login an agent
      tags: [login]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - emailOrPhone
                - password
              properties:
                emailOrPhone:
                  type: string
                  example: formatmail1@gmail.com
                password:
                  type: string
                  example: Forma@gmail
      responses:
        "200":
          description: agent successfully logged in

  /api/v1/agent/forget-Password:
    post:
      summary: this endpoint is to forget the agents password
      tags: [forget-password]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - emailOrPhone
              properties:
                emailOrPhone:
                  type: string
                  example: formatmail1@gmail.com
      responses:
        "200":
          description: successfully forgotten password

  /api/v1/agent/reset-Password:
    post:
      summary: this endpoint is to reset the Agents password
      tags: [reset-password]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - email
                - password
              properties:
                email:
                  type: string
                  example: formatmail1@gmail.com
                password:
                  type: string
                  example: Forma@gmail
      responses:
        "200":
          description: successfully reset the Agents password

  /api/v1/agent/resendOtp:
    post:
      summary: this endpoint is to resend the Agents otp
      tags: [resendOtp]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - email
                - password
              properties:
                email:
                  type: string
                  example: formatmail1@gmail.com
      responses:
        "200":
          description: successfully resent the Agents otp
  

  

        
