openapi: 3.0.0
info:
  title: documentation for the farmers KYC
  version: 1.0.0
  description: covers simple test for Farmers KYC
paths: 
  /api/v1/farmKyc/create/{farmId}:
    post:
      summary: this endpoint is to create the kyc for farmer
      parameters:
        - in: path
          name: farmId
      tags: [Farmer]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - state
                - specificLocationOrLandmark
                - whatDoYouFarm
                - preferredMarketDestination
                - farmSize
              properties:
                state:
                  type: string
                  example: Akwaibom
                specificLocationOrLandmark:
                  type: string
                  example: akwaibom city gate
                whatDoYouFarm:
                  type: string
                  example: watermelon
                preferredMarketDestination: 
                  type: string
                  example: lagos state university
                farmSize:
                  type: string
                  example: Small                  
      responses:
        "201":
          description: farmer's kyc successfully created       

  /api/v1/farmKyc/getKyc:
    get:
      summary: this endpoint is to get the farmers kyc
      tags: [Farmer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten a farmers kyc

  /api/v1/vehicle/allVehic:
    get:
      summary: this endpoint is to get all Vehicle types
      tags: [get all Vehicle types]
      responses:
        "200":
          description: successfully gotten all vehicle types
  