/api/v1/farmerDash/updateFarmer:
  patch:
    summary: Update farmer profile
    tags: [Farmer]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              firstName:
                type: string
                example: John
              lastName:
                type: string
                example: Philips
              email:
                type: string
                example: stingify@gmail.com
              townOrVillage:
                type: string
                example: Lagos
              farmSize:
                type: string
                description: Small
              profilePicture:
                type: string
                format: binary
                description: Profile picture image (JPG, PNG, GIF)
    responses:
      "200":
        description: Profile updated successfully


/api/v1/support/createReport:
  post:
    summary: Create a support report 
    tags: [Support]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - issueType
              - description
            properties:
              issueType:
                type: string
                enum: [Payment Issue, Delivery Problem, Driver Complaint, Technical Issue, Other]
                example: Payment Issue
              description:
                type: string
                example: I made a delivery payment but it's still showing as pending after 2 days.
    responses:
      "200":
        description: Report submitted successfully

