      tags: [Farmer]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: successfully gotten one available job info for the farmer

/api/v1/agentDelivery/estimatePrice:
   post:
      summary: This endpoint is to calculate the estimated delivery for the agent before creating the request
      tags: [Agent]
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required: 
                - pickupLocation
                - Destination
                - vehicleType
              properties:
                pickupLocation:
                  type: string
                  example: 23 Liverpool Road Apapa Lagos
                Destination:
                  type: string
                  example: ikorodu Lagos  
                vehicleType:
                  type: string
                  example: 6a2dd9507901672d4346f51b              
      responses:
        "200":
          description: successfully gotten estimated price for delivery

