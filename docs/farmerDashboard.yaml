/api/v1/agentKyc/createDelivery/{agentId}:
    post:
      summary: this endpoint is to create an Agents kyc
      tags: [Agent]
      parameters:
        - in: path
          name: agentId
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - state
                - residentialAddress
                - kinsFirstName
                - kinsLastName
                - kinsPhoneNumber
                - kinsEmail
                - kinsRelationship
                - kinsLgaOrTown
                - kinsResidentialAddress
                - verificationDocument                
              properties:
                state:
                  type: string
                  example: Lagos State
                residentialAddress:
                  type: string
                  example: 23 Liverpool Road Apapa Lagos
                kinsFirstName:
                  type: string
                  example: David
                kinsLastName:
                  type: string
                  example: Daniels
                kinsPhoneNumber:
                  type: string
                  example: 07012904290
                kinsEmail:
                  type: string
                  example: formatgmail@gmail.com
                kinsRelationship:
                  type: string
                  example: Brother
                kinsLgaOrTown:
                  type: string
                  example: Lagos
                kinsResidentialAddress:
                  type: string
                  example: 23 Liverpool Road Apapa Lagos
                verificationDocument:
                  type: string
                  format: binary
                  description: documents to show you are an agent
      responses:
        "201":
          description: successfully created Kyc for agent

